<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Area Code City Finder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

header {
    background: #020617;
    padding: 20px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
}

main {
    max-width: 600px;
    margin: auto;
    padding: 30px;
}

input {
    width: 100%;
    padding: 15px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    margin-top: 10px;
}

button {
    margin-top: 15px;
    padding: 15px;
    font-size: 16px;
    background: #38bdf8;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
}

button:hover {
    background: #0ea5e9;
}

.card {
    background: #020617;
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
}

.warning {
    color: #facc15;
    font-size: 14px;
    margin-top: 15px;
}
</style>
</head>

<body>

<header>
📞 Area Code City Finder
</header>

<main>
<p>Enter a phone <strong>area code</strong> (example: 540)</p>

<input type="number" id="codeInput" placeholder="Enter area code">

<button onclick="lookupCode()">Find Location</button>

<div class="card" id="result">
<p>No data yet.</p>
</div>

<p class="warning">
⚠ This tool only checks phone area codes.  
It does NOT track phone numbers or people.
</p>
</main>

<script>
const areaCodes = {
    "540": {
        state: "Virginia",
        cities: "Roanoke, Fredericksburg, Harrisonburg"
    },
    "703": {
        state: "Virginia",
        cities: "Arlington, Alexandria, Fairfax"
    },
    "212": {
        state: "New York",
        cities: "Manhattan"
    },
    "213": {
        state: "California",
        cities: "Los Angeles"
    },
    "305": {
        state: "Florida",
        cities: "Miami"
    },
    "312": {
        state: "Illinois",
        cities: "Chicago"
    }
};

function lookupCode() {
    const input = document.getElementById("codeInput").value;
    const result = document.getElementById("result");

    if (areaCodes[input]) {
        result.innerHTML = `
            <p><strong>Area Code:</strong> ${input}</p>
            <p><strong>State:</strong> ${areaCodes[input].state}</p>
            <p><strong>Example Cities:</strong> ${areaCodes[input].cities}</p>
        `;
    } else {
        result.innerHTML = `
            <p>❌ Area code not found.</p>
            <p>Try another one.</p>
        `;
    }
}
</script>

</body>
</html>
