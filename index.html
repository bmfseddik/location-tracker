<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Location Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
        }

        header {
            background-color: #020617;
            padding: 20px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
        }

        main {
            max-width: 700px;
            margin: auto;
            padding: 30px;
        }

        button {
            background-color: #38bdf8;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0ea5e9;
        }

        .card {
            background-color: #020617;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
        }

        .warning {
            color: #facc15;
            margin-top: 20px;
            font-size: 14px;
        }

        a {
            color: #38bdf8;
        }
    </style>
</head>

<body>

<header>
    📍 Location Tracker (Consent-Based)
</header>

<main>
    <p>
        This website can show your approximate or GPS location
        <strong>only if you allow it</strong>.
    </p>

    <button onclick="getLocation()">Get My Location</button>

    <div class="card" id="output">
        <p>No location data yet.</p>
    </div>

    <p class="warning">
        ⚠ This site does NOT track people by phone number.  
        Location access requires user permission.
    </p>
</main>

<script>
    function getLocation() {
        const output = document.getElementById("output");

        if (!navigator.geolocation) {
            output.innerHTML = "<p>Geolocation is not supported.</p>";
            return;
        }

        output.innerHTML = "<p>Requesting location permission...</p>";

        navigator.geolocation.getCurrentPosition(
            function(position) {
                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                output.innerHTML = `
                    <p><strong>Latitude:</strong> ${latitude}</p>
                    <p><strong>Longitude:</strong> ${longitude}</p>
                    <p><strong>Accuracy:</strong> ${accuracy} meters</p>
                    <p>
                        <a href="https://www.google.com/maps?q=${latitude},${longitude}" target="_blank">
                            Open in Google Maps
                        </a>
                    </p>
                `;
            },
            function(error) {
                output.innerHTML = `
                    <p>Failed to get location.</p>
                    <p>Error: ${error.message}</p>
                `;
            },
            {
                enableHighAccuracy: true,
                timeout: 10000
            }
        );
    }
</script>

</body>
</html>
